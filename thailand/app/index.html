<title>תאילנד 2026 – הסוכן שלנו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@300;400;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Thai:wght@300;400&display=swap" rel="stylesheet">
<style>
/* THE PRIVATE TRAVEL EDIT — a personal travel edition, printed for two.
   LAYOUT: an editorial masthead + one "plate" (illustrated destination art) per chapter; content set as
   typeset columns, timelines and lists, not card grids. Mobile: bottom nav, thumb-zone actions. Desktop: RTL side rail.
   Light = the day edition (ivory paper, ink). Dark = the night edition (jungle-black, warm ivory ink). */
:root{
  --paper:#F1ECE2; --paper-2:#E7DFD0; --sand:#D8CCB6; --stone:#B9AF9C;
  --ink:#1A1C18; --ink-2:#464A41; --ink-3:#7A7C70;
  --olive:#5C6240; --jungle:#1E4A39; --sea:#2D5F63;
  --accent:#C42F64; --accent-ink:#FFFFFF;
  --line:rgba(26,28,24,.14); --line-2:rgba(26,28,24,.26);
  --raise:#FBF8F2; --veil:rgba(20,22,18,.46); --shadow:0 18px 50px -20px rgba(20,22,18,.45);
  --ok:#2F6B47; --warn:#9A6A12;
  --f-display:"Karantina","Secular One","Heebo",Arial,sans-serif;
  --f-serif:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --f-sans:"IBM Plex Sans Hebrew","Heebo",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-thai:"Noto Sans Thai",sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutR:max(16px,env(safe-area-inset-right,0px));
  --nav-h:64px; --ease:cubic-bezier(.2,.7,.1,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11140F; --paper-2:#191D16; --sand:#2A2F25; --stone:#4A5042;
  --ink:#ECE5D6; --ink-2:#BDB7A8; --ink-3:#8C8A7D;
  --olive:#AEB57F; --jungle:#86BFA0; --sea:#7FB3B2;
  --accent:#F0679A; --accent-ink:#1A0B11;
  --line:rgba(236,229,214,.13); --line-2:rgba(236,229,214,.24);
  --raise:#1B1F18; --veil:rgba(0,0,0,.6); --shadow:0 18px 50px -18px rgba(0,0,0,.8);
  --ok:#8CC79E; --warn:#E2B867; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11140F; --paper-2:#191D16; --sand:#2A2F25; --stone:#4A5042;
  --ink:#ECE5D6; --ink-2:#BDB7A8; --ink-3:#8C8A7D;
  --olive:#AEB57F; --jungle:#86BFA0; --sea:#7FB3B2;
  --accent:#F0679A; --accent-ink:#1A0B11;
  --line:rgba(236,229,214,.13); --line-2:rgba(236,229,214,.24);
  --raise:#1B1F18; --veil:rgba(0,0,0,.6); --shadow:0 18px 50px -18px rgba(0,0,0,.8);
  --ok:#8CC79E; --warn:#E2B867; color-scheme:dark}

*{box-sizing:border-box;min-width:0}
html{direction:rtl}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f-sans);overflow-x:clip;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
button,input,select,textarea{font:inherit;color:inherit;font-size:16px}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
bdi{unicode-bidi:isolate}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.thai{font-family:var(--f-thai);font-weight:300}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:500 12.5px/1.3 var(--f-sans);color:var(--ink-3);letter-spacing:.02em}
.eyebrow b{color:var(--ink);font-weight:600}
.rule{height:1px;background:var(--line);border:0;margin:0}
.wrap{padding-inline-start:var(--gutR);padding-inline-end:var(--gut);max-width:1180px;margin-inline:auto}

/* ---------- shell ---------- */
.app{min-height:100vh;padding-bottom:calc(var(--nav-h) + 36px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font:700 25px/1 var(--f-display);letter-spacing:.01em}
.brand span{font:400 12px/1 var(--f-sans);color:var(--ink-3)}
.topbar .sp{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--stone)}
.sync.live i{background:var(--ok)} .sync.err i{background:var(--accent)}
.sync:not(.err) span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.topbar .iconbtn{width:40px;height:40px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.iconbtn:hover{background:var(--paper-2)}
.iconbtn svg{width:22px;height:22px}

.nav{position:fixed;inset:auto 0 0 0;z-index:35;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:0 var(--gut) env(safe-area-inset-bottom,0px) var(--gutR)}
.nav ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(5,1fr) 1.15fr;max-width:600px;height:var(--nav-h);align-items:center}
.nav .navbrand{display:none}
.nav-cc{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--ink);width:100%;height:100%;justify-content:center}
.nav-cc .orb{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;margin-top:-2px;transition:transform .3s var(--ease)}
.nav-cc .orb svg{width:19px;height:19px}
.nav-cc:active .orb{transform:scale(.9)}
.nav-cc .lb{font-size:11.5px;margin-top:-1px}
.cc-li{border-inline-start:1px solid var(--line);height:44px;display:flex}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--ink-3);font-size:12px;font-weight:500;height:100%;position:relative}
.nav a svg{width:23px;height:23px;transition:transform .3s var(--ease)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::before{content:"";position:absolute;top:0;width:22px;height:2px;background:var(--ink);border-radius:2px}
.nav a:active svg{transform:scale(.88)}

main{display:block}
.view{animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- plate (destination art) ---------- */
.plate{position:relative;background:var(--paper-2) center/cover no-repeat;overflow:hidden}
.plate::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);pointer-events:none}
.plate .cap{position:absolute;inset-block-end:10px;inset-inline-start:12px;font:400 11px/1 var(--f-mono);color:rgba(255,255,255,.82);direction:ltr;letter-spacing:.04em}

/* ---------- TODAY ---------- */
.cover{position:relative;margin-inline:calc(-1*var(--gutR)) calc(-1*var(--gut));color:#FBF6EC;overflow:hidden}
.cover .plate{height:min(76vh,640px);min-height:440px;width:100%;animation:coverIn 1.4s var(--ease) both}
@keyframes coverIn{from{transform:scale(1.06);filter:saturate(.6)}to{transform:none;filter:none}}
.cover::before,.cover::after{content:"";position:absolute;inset-inline:0;pointer-events:none;z-index:1}
.cover::before{top:0;height:30%;background:linear-gradient(rgba(10,12,9,.5),rgba(10,12,9,0))}
.cover::after{bottom:0;height:58%;background:linear-gradient(to top,rgba(10,12,9,.78),rgba(10,12,9,.25) 60%,rgba(10,12,9,0))}
.cv-top{position:absolute;z-index:2;top:14px;inset-inline:var(--gutR) var(--gut);display:flex;justify-content:space-between;gap:10px;font:500 12.5px/1.2 var(--f-sans);letter-spacing:.02em;padding-bottom:8px;border-bottom:1px solid rgba(251,246,236,.45)}
.cv-num{position:absolute;z-index:2;top:46px;inset-inline-end:var(--gut);display:flex;align-items:flex-start;gap:6px;text-align:end}
.cv-num b{font:300 88px/.8 var(--f-display)}
.cv-num span{font:400 12.5px/1.25 var(--f-sans);opacity:.85;padding-top:6px}
.cv-bot{position:absolute;z-index:2;inset-inline:var(--gutR) var(--gut);bottom:20px}
.cover .chap{font:500 13px/1 var(--f-sans);display:flex;gap:10px;align-items:baseline;opacity:.92}
.cover .chap .thai{font-size:15px}
.cover h1{font:700 clamp(96px,30vw,210px)/.76 var(--f-display);margin-top:10px;letter-spacing:-.005em}
.cover .sub{font:400 17px/1.45 var(--f-serif);max-width:32ch;margin-top:10px}
.cover .geo{display:block;font-size:11px;opacity:.6;margin-top:12px;direction:ltr;text-align:end;letter-spacing:.05em}
.progress{margin-top:18px}
.progress .route{display:flex;gap:3px;align-items:flex-end;height:30px}
.progress .seg{display:flex;gap:2px;flex:var(--d) 1 0;flex-direction:column}
.progress .ticks{display:flex;gap:2px;height:8px}
.progress .ticks i{flex:1;background:var(--sand);border-radius:1px;transition:background .6s var(--ease)}
.progress .ticks i.past{background:var(--ink)}
.progress .ticks i.now{background:var(--accent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.progress .seg small{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress .seg.cur small{color:var(--ink);font-weight:600}
.story{font:400 18px/1.55 var(--f-serif);color:var(--ink-2);margin-top:12px;max-width:44ch}
.story .num{font:500 19px/1 var(--f-serif);color:var(--ink);font-variant-numeric:lining-nums}
.nextup{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:16px;margin-bottom:4px}
.asks{display:flex;gap:4px 18px;flex-wrap:wrap;margin-top:6px}
.brief{list-style:none;margin:0;padding:0}
.brief li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding-block:12px;border-top:1px solid var(--line)}
.brief .sc{font-size:14px;color:var(--ink-3);padding-top:3px}
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font:700 34px/.95 var(--f-display)}
.sec-h .more{font-size:14px;color:var(--ink-2);white-space:nowrap}
.sec-h .more:hover{color:var(--ink)}
.lede{font:400 17px/1.55 var(--f-serif);color:var(--ink-2);max-width:60ch}

.twocol{display:grid;gap:34px}
.next{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;text-decoration:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px}
.next .plate{aspect-ratio:1;border-radius:50%}
.next h3{font:700 36px/.9 var(--f-display)}
.next p{font-size:14px;color:var(--ink-2)}

.mapthumb{display:block;position:relative;border-radius:2px;overflow:hidden;background:var(--paper-2);aspect-ratio:16/10;text-decoration:none}
.mapthumb svg{width:100%;height:100%;display:block}
.mapthumb .lbl{position:absolute;inset-block-end:10px;inset-inline-start:12px;background:var(--paper);padding:6px 11px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:0 4px 14px -6px rgba(0,0,0,.3)}

.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding-block:12px;border-bottom:1px solid var(--line)}
.checklist .ttl{font-weight:500;line-height:1.35}
.checklist .meta{font-size:13.5px;color:var(--ink-3);margin-top:2px}

.box{width:26px;height:26px;border:1.5px solid var(--ink-2);border-radius:50%;display:grid;place-items:center;transition:background .25s,border-color .25s;flex:none}
.box svg{width:14px;height:14px;opacity:0;transform:scale(.4) rotate(-20deg);transition:all .35s var(--ease);color:var(--paper)}
.box[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.box[aria-pressed="true"] svg{opacity:1;transform:none}
.box.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.22)}}

/* ---------- timeline ---------- */
.tl{position:relative;list-style:none;margin:0;padding:0}
.tl::before{content:"";position:absolute;inset-block:8px;inset-inline-start:58px;width:1px;background:var(--line-2)}
.ev{position:relative;display:grid;grid-template-columns:50px 1fr auto;gap:0 18px;padding-block:12px}
.ev .t{font:500 14px/1.25 var(--f-mono);color:var(--ink-2);text-align:end;padding-top:2px;direction:ltr;unicode-bidi:isolate}
.ev .t small{display:block;font:400 11.5px/1.3 var(--f-sans);color:var(--ink-3);direction:rtl}
.ev::before{content:"";position:absolute;inset-inline-start:54px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink-2)}
.ev .body{min-width:0;cursor:pointer}
.ev .k{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev .n{font:500 17px/1.3 var(--f-sans);margin-top:1px}
.ev .m{font-size:13.5px;color:var(--ink-3);margin-top:3px}
.ev .side{display:flex;flex-direction:column;align-items:center;gap:4px}
.ev.major .n{font:500 23px/1.2 var(--f-serif)}
.ev .kl{font-weight:600;color:var(--ink-2)}
.ev.major::before{background:var(--ink);border-color:var(--ink);width:11px;height:11px;inset-inline-start:53px;top:17px}
.ev.meal .n::before{content:"";display:inline-block;width:14px;height:14px;margin-inline-end:7px;vertical-align:-1px;background:currentColor;opacity:.55;-webkit-mask:var(--i-fork) center/contain no-repeat;mask:var(--i-fork) center/contain no-repeat}
.ev.transport{padding-block:16px}
.ev.transport::before{border-style:dashed;border-radius:2px;transform:rotate(45deg)}
.ev.transport .n{font:500 15.5px/1.35 var(--f-sans)}
.ev.transport .body{border-inline-start:2px dashed var(--line-2);padding-inline-start:12px}
.ev.hotel{padding-block:8px}
.ev.hotel::before{background:var(--olive);border-color:var(--olive);border-radius:2px}
.ev.hotel .n{font-size:14.5px;color:var(--olive);font-weight:500}
.ev.booking .body{background:var(--raise);border:1px solid var(--line);padding:10px 14px;border-radius:3px;position:relative;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,transparent 6.5px,#000 7px) ,radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px);-webkit-mask-composite:source-in;mask:radial-gradient(circle 7px at 0 50%,transparent 6.5px,#000 7px),radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px);mask-composite:intersect}
.ev.booking .k{color:var(--accent)}
.ev.free{padding-block:6px}
.ev.free::before{display:none}
.ev.free .body{font-size:13.5px;color:var(--ink-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line-2);border-radius:3px;padding:8px 12px;cursor:default}
.ev.done .n{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2);text-decoration-thickness:1.5px}
.ev.done::before{background:var(--ok);border-color:var(--ok)}
.ev.now::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.tl .group{padding:16px 0 4px 0;padding-inline-start:76px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.reorder{display:flex;gap:2px}
.reorder button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.reorder button:hover{background:var(--paper-2)}
.reorder svg{width:18px;height:18px}

.fav{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-3);border-radius:50%}
.fav svg{width:19px;height:19px;transition:transform .35s var(--ease);fill:none}
.fav[aria-pressed="true"]{color:var(--accent)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.fav.pop svg{animation:pop .45s var(--ease)}

.tag{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f-sans);letter-spacing:.01em;white-space:nowrap;color:var(--ink-2)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tag.MUST{color:var(--accent)} .tag.HIGH{color:var(--jungle)} .tag.OPTIONAL{color:var(--ink-3)} .tag.GEM{color:var(--olive)} .tag.BACKUP{color:var(--warn)}
.score{font:500 12.5px/1 var(--f-mono);color:var(--ink-2);direction:ltr;unicode-bidi:isolate}

.empty{padding:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.empty h3{font:700 30px/1 var(--f-display)}
.empty p{color:var(--ink-2);margin-top:6px;max-width:48ch}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:500;font-size:15px;white-space:nowrap;transition:transform .15s,opacity .2s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--paper-2)}
.btn.danger{background:var(--accent);color:var(--accent-ink)}
.btn svg{width:18px;height:18px}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.ask-inline{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--jungle);font-weight:500;min-height:40px}
.ask-inline .seal{width:16px;height:16px}
.ask-inline:hover{text-decoration:underline;text-underline-offset:4px}

/* ---------- PLAN ---------- */
.days{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:20;background:var(--paper);border-bottom:1px solid var(--line);margin-top:6px}
.days .rail{display:flex;overflow-x:auto;scrollbar-width:none;padding-inline:var(--gutR) var(--gut);scroll-snap-type:x proximity}
.days .rail::-webkit-scrollbar{display:none}
.days .grp{display:flex;flex-direction:column;flex:none;border-inline-start:1px solid var(--line);padding-inline-start:4px;margin-inline-start:4px}
.days .grp:first-child{border:0;padding:0;margin:0}
.days .grp>small{font-size:11.5px;color:var(--ink-3);padding:8px 6px 0;white-space:nowrap;font-weight:500}
.days .grp>div{display:flex}
.day{flex:none;width:46px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:3px;scroll-snap-align:center;position:relative;color:var(--ink-2)}
.day .w{font-size:11.5px}
.day .d{font:700 26px/.9 var(--f-display);color:var(--ink)}
.day .dots{display:flex;gap:2px;height:4px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
.day.past .d{color:var(--ink-3)}
.day.today::after{content:"";position:absolute;top:5px;inset-inline-end:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.day[aria-pressed="true"] .d{color:var(--paper)}
.day[aria-pressed="true"] .dots i{background:var(--paper)}
.dayhead{padding-block:22px 10px}
.dayhead h2{font:700 clamp(46px,13vw,76px)/.86 var(--f-display);margin-top:8px}
.dayhead p{font-size:14px;color:var(--ink-2);margin-top:8px}
.live{color:var(--accent);font-weight:600}
.dayacts{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;padding-block:6px 4px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dayacts .sp{flex:1}
.tray{margin-top:30px}
.tray h3{font:700 26px/1 var(--f-display)}
.tray .row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-padding-inline:var(--gutR) var(--gut);padding-block:12px;margin-inline:calc(-1*var(--gutR)) calc(-1*var(--gut));padding-inline:var(--gutR) var(--gut);scroll-snap-type:x mandatory}
.tray .row::-webkit-scrollbar{display:none}
.slip{flex:none;width:210px;border-top:2px solid var(--ink);padding-top:10px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.slip .n{font-weight:500;line-height:1.3;cursor:pointer}
.slip .m{font-size:13px;color:var(--ink-3)}
.slip .btn{align-self:flex-start;margin-top:auto}

/* ---------- CHAPTERS ---------- */
.chapters{list-style:none;margin:0;padding:0}
.chrow{display:grid;grid-template-columns:1fr 38%;gap:16px;align-items:end;padding-block:22px;border-bottom:1px solid var(--line);text-decoration:none;position:relative}
.chrow:nth-child(even){grid-template-columns:38% 1fr}
.chrow:nth-child(even) .plate{order:-1}
.chrow .plate{aspect-ratio:3/4;border-radius:2px;transition:transform .6s var(--ease)}
.chrow:hover .plate{transform:scale(1.015)}
.chrow .no{font:400 15px/1 var(--f-serif);color:var(--ink-3)}
.chrow h2{font:700 clamp(64px,17vw,120px)/.8 var(--f-display);margin-top:8px}
.chrow .thai{font-size:14px;color:var(--ink-3);margin-top:6px;display:block}
.chrow .when{font:500 13px/1.3 var(--f-mono);margin-top:10px;direction:ltr;unicode-bidi:isolate;display:inline-block}
.chrow .hot{font-size:14px;color:var(--ink-2);margin-top:2px}
.chrow .cnt{font-size:13px;color:var(--ink-3);margin-top:10px}
.chrow.cur .no::after{content:" · אתם כאן";color:var(--accent);font-family:var(--f-sans);font-size:13px;font-weight:600}

.chhero{position:relative;margin-inline:calc(-1*var(--gutR)) calc(-1*var(--gut))}
.chhero .plate{aspect-ratio:5/6;max-height:72vh;width:100%}
.chhero .over{position:absolute;inset:auto 0 0 0;padding:20px var(--gut) 18px var(--gutR);color:#FBF6EC;background:linear-gradient(to top,rgba(10,12,9,.7) 20%,rgba(10,12,9,0))}
.chhero .no{font:400 16px/1 var(--f-serif);opacity:.9}
.chhero h1{font:700 clamp(100px,30vw,230px)/.76 var(--f-display);margin-top:12px}
.chhero .thai{display:block;font-size:17px;opacity:.85;margin-top:6px}
.chhero .line{font:400 17px/1.45 var(--f-serif);max-width:36ch;margin-top:10px}
.chnav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.chnav a{font-size:14px;color:var(--ink-2);text-decoration:none;min-height:40px;display:flex;align-items:center;gap:6px}
.chnav a:hover{color:var(--ink)}
.chnav svg{width:16px;height:16px}

.hotel{display:grid;grid-template-columns:1fr;gap:14px;padding-block:22px;border-bottom:1px solid var(--ink)}
.hotel .lbl{font:500 12.5px/1 var(--f-sans);color:var(--ink-3)}
.hotel h3{font:500 26px/1.15 var(--f-serif);margin-top:6px}
.hotel dl{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:4px 26px;margin:0}
.hotel dt{font-size:12px;color:var(--ink-3)}
.hotel dd{margin:0;font:700 26px/1 var(--f-display)}
.hotel .acts{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}

.daystrip{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:4px}
.daystrip::-webkit-scrollbar{display:none}
.daystrip .day{text-decoration:none}
.daystrip .day:hover{background:var(--paper-2)}
.daychip{border:1px solid var(--line-2);border-radius:3px;padding:6px 10px 5px;text-align:center;text-decoration:none;min-width:58px}
.daychip b{display:block;font:700 22px/.9 var(--f-display)}
.daychip small{font-size:11.5px;color:var(--ink-3)}
.daychip.today{border-color:var(--accent)}

.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*var(--gutR)) calc(-1*var(--gut));padding:2px var(--gut) 2px var(--gutR)}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);font-size:14px;white-space:nowrap;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .c{font:500 11.5px var(--f-mono);opacity:.6;margin-inline-start:4px}
.searchrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.field{flex:1;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-2);height:44px}
.field svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.field input{flex:1;border:0;background:transparent;outline:0;height:100%}
.sel{height:40px;border:1px solid var(--line-2);border-radius:999px;background:transparent;padding:0 12px}

.guide{margin-top:8px}
.gsec{padding-block:24px 6px}
.gsec>h3{font:700 32px/.95 var(--f-display);display:flex;align-items:baseline;gap:10px}
.gsec>h3 small{font:400 13px/1 var(--f-sans);color:var(--ink-3)}
.gsec>.intro{font-size:14px;color:var(--ink-2);margin-top:4px}
/* ranked list (nightlife/events) */
.ranked{list-style:none;margin:10px 0 0;padding:0}
.ranked li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding-block:16px;border-top:1px solid var(--line);align-items:start}
.ranked .sc{font:700 46px/.8 var(--f-display);color:var(--ink);text-align:center}
.ranked .sc small{display:block;font:400 11px/1.2 var(--f-sans);color:var(--ink-3)}
.ranked .sc.na{color:var(--stone);font-size:32px}
.it-n{font:500 18px/1.3 var(--f-sans);cursor:pointer}
.it-n:hover{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.it-m{font-size:13.5px;color:var(--ink-3);margin-top:2px}
.it-note{font:400 15px/1.55 var(--f-serif);color:var(--ink-2);margin-top:6px;max-width:62ch}
.it-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.st-mini{font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-2)}
.st-mini.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st-mini.want{background:color-mix(in srgb,var(--jungle) 14%,transparent);color:var(--jungle)}
.st-mini.date{background:transparent;border:1px solid var(--line-2)}
.li-done .it-n{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.li-skip{opacity:.5}
/* postcards (sea / extreme) */
.cards-h{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;scroll-padding-inline:var(--gutR) var(--gut);padding-block:12px;margin-inline:calc(-1*var(--gutR)) calc(-1*var(--gut));padding-inline:var(--gutR) var(--gut);scroll-snap-type:x mandatory}
.cards-h::-webkit-scrollbar{display:none}
.pc{flex:none;width:min(72vw,280px);scroll-snap-align:start;cursor:pointer}
.pc .plate{aspect-ratio:5/4;border-radius:2px;transition:transform .5s var(--ease)}
.pc:hover .plate{transform:scale(1.02)}
.pc .n{font:700 28px/.95 var(--f-display);margin-top:10px}
.pc .m{font-size:13px;color:var(--ink-3);margin-top:3px}
/* menu (food) */
.menu{list-style:none;margin:8px 0 0;padding:0}
.menu li{padding-block:12px;border-top:1px dotted var(--line-2)}
.menu .top{display:flex;align-items:baseline;gap:8px}
.menu .top .it-n{flex:none;max-width:70%}
.menu .lead{flex:1;border-bottom:1.5px dotted var(--stone);transform:translateY(-4px);min-width:20px}
.menu .price{font:500 13px/1 var(--f-mono);color:var(--ink-2);white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
/* route (move) */
.routes{list-style:none;margin:10px 0 0;padding:0}
.routes li{padding-block:14px;border-top:1px solid var(--line)}
.routes .path{display:flex;align-items:center;gap:8px;font:700 26px/1 var(--f-display);flex-wrap:wrap}
.routes .path svg{width:20px;height:20px;color:var(--ink-3)}
/* tickets (book) */
.tickets{display:grid;gap:10px;margin-top:10px}
.ticket{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--raise);border:1px solid var(--line);padding:14px 16px;border-radius:3px;position:relative}
.ticket::before{content:"";position:absolute;inset-block:10px;inset-inline-end:62px;border-inline-start:1.5px dashed var(--line-2)}
.ticket .lbl{font:600 11.5px/1 var(--f-sans);color:var(--accent)}
/* notes (warn) */
.notes{list-style:none;margin:10px 0 0;padding:0;border-inline-start:2px solid var(--warn);padding-inline-start:16px}
.notes li{padding-block:10px}
.notes .it-n{font-weight:600;font-size:16px}
.notes .it-note{font-size:14.5px}
.plain{list-style:none;margin:8px 0 0;padding:0}
.plain li{padding-block:12px;border-top:1px solid var(--line)}

.chnotes{margin-top:30px;padding-block:20px;border-top:1px solid var(--ink)}
.chnotes h3{font:700 28px/1 var(--f-display)}
.chnotes textarea{width:100%;min-height:110px;margin-top:10px;border:0;border-bottom:1px solid var(--line-2);background:transparent;resize:vertical;font:400 16px/1.7 var(--f-serif);outline:0;padding:4px 0;
  background-image:repeating-linear-gradient(transparent 0 26.2px,var(--line) 26.2px 27.2px);background-attachment:local}
.saved-ind{font-size:12.5px;color:var(--ink-3);min-height:18px}

/* ---------- MAP ---------- */
.mapview{position:relative}
.mapwrap{position:relative;height:calc(100vh - 56px - var(--nav-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px;background:color-mix(in srgb,var(--sea) 20%,var(--paper));overflow:hidden;touch-action:none;margin-inline:calc(-1*var(--gutR)) calc(-1*var(--gut))}
#mapsvg{width:100%;height:100%;display:block;cursor:grab}
#mapsvg:active{cursor:grabbing}
.land{fill:var(--paper);stroke:none}
.grat{stroke:color-mix(in srgb,var(--sea) 22%,transparent);vector-effect:non-scaling-stroke;stroke-width:.6}
.route-line{fill:none;stroke:var(--ink);stroke-dasharray:2 5;vector-effect:non-scaling-stroke;stroke-width:1.4;stroke-linecap:round}
.pin{cursor:pointer}
.pin circle{vector-effect:non-scaling-stroke;stroke:var(--paper);stroke-width:2}
.pin.sel circle.o{stroke:var(--accent);stroke-width:2.5;fill:none}
.pin text,.hlbl{font:600 1px var(--f-sans);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:.25;stroke-linejoin:round}
.maptop{position:absolute;top:12px;inset-inline:12px;display:flex;flex-direction:column;gap:8px;z-index:2;pointer-events:none}
.maptop>*{pointer-events:auto}
.regions{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.regions .chip,.mfil .chip{background:var(--paper);box-shadow:0 2px 10px -4px rgba(0,0,0,.25)}
.regions .chip[aria-pressed="true"],.mfil .chip[aria-pressed="true"]{background:var(--ink)}
.mfil{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mfil::-webkit-scrollbar{display:none}
.mapzoom{position:absolute;inset-inline-start:12px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapzoom button{width:42px;height:42px;border-radius:50%;background:var(--paper);box-shadow:0 2px 10px -4px rgba(0,0,0,.3);display:grid;place-items:center}
.mapzoom svg{width:18px;height:18px}
.mapnote{position:absolute;inset-inline-end:12px;bottom:16px;z-index:2;font-size:12px;color:var(--ink-2);background:color-mix(in srgb,var(--paper) 85%,transparent);padding:5px 10px;border-radius:999px;max-width:60%}
.mapask{position:absolute;inset-inline-end:12px;bottom:50px;z-index:2}
.mapask .btn{box-shadow:0 4px 16px -6px rgba(0,0,0,.35)}
.attrib{position:absolute;inset-inline-start:62px;bottom:6px;font-size:10px;color:var(--ink-3);direction:ltr;z-index:2}

/* ---------- JOURNAL ---------- */
.jhead{padding-block:22px 10px;border-bottom:1px solid var(--ink)}
.jhead h1{font:700 clamp(72px,20vw,140px)/.8 var(--f-display)}
.jhead .lede{margin-top:10px}
.jstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.jstats div{border-inline-start:1px solid var(--line-2);padding-inline-start:10px}
.jstats div:first-child{border:0;padding:0}
.jstats b{display:block;font:700 40px/.9 var(--f-display)}
.jstats small{font-size:12px;color:var(--ink-3)}
.jday{padding-block:22px 6px}
.jday>h3{display:flex;align-items:baseline;gap:10px;font:500 20px/1.2 var(--f-serif)}
.jday>h3 .mono{font-size:13px;color:var(--ink-3);font-family:var(--f-mono)}
.jent{display:grid;gap:8px;padding-block:16px;border-top:1px solid var(--line)}
.jent .n{font:700 34px/.92 var(--f-display);cursor:pointer}
.stars{display:flex;gap:2px;direction:rtl}
.stars button{width:32px;height:32px;display:grid;place-items:center;color:var(--stone)}
.stars button svg{width:20px;height:20px;fill:none}
.stars button.on{color:var(--warn)}
.stars button.on svg{fill:currentColor}
.memory{width:100%;border:0;border-inline-start:2px solid var(--line-2);background:transparent;padding:4px 12px;font:italic 400 16.5px/1.6 var(--f-serif);resize:vertical;min-height:52px;outline:0}
.memory:focus{border-color:var(--ink)}
.photos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.photos img{height:120px;width:auto;border-radius:2px;flex:none;cursor:pointer;box-shadow:0 6px 18px -10px rgba(0,0,0,.5)}
.photos img:nth-child(odd){transform:rotate(-1.2deg)} .photos img:nth-child(even){transform:rotate(1deg)}
.addphoto{flex:none;width:92px;height:120px;border:1px dashed var(--line-2);border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--ink-3);cursor:pointer}
.addphoto svg{width:20px;height:20px}

/* ---------- sheet / dialogs ---------- */
.scrim{position:fixed;inset:0;background:var(--veil);z-index:60;opacity:0;transition:opacity .3s}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:61;inset:auto 0 0 0;max-height:92vh;background:var(--paper);border-radius:14px 14px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .42s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:9px auto 0;flex:none}
.sheet .sh-h{display:flex;align-items:center;gap:8px;padding:6px max(8px,env(safe-area-inset-left,0px)) 4px max(16px,env(safe-area-inset-right,0px));flex:none}
.sheet .sh-h .sp{flex:1}
.sheet .sh-b{overflow-y:auto;padding:4px var(--gut) 24px var(--gutR);overscroll-behavior:contain}
.detail h2{font:700 clamp(46px,12vw,72px)/.86 var(--f-display);margin-top:6px}
.detail .tags{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:18px 0 0;padding-block:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.detail dt{font-size:13px;color:var(--ink-3);padding-top:2px}
.detail dd{margin:0;font-size:15px}
.detail .why{font:400 18px/1.6 var(--f-serif);margin-top:16px;color:var(--ink)}
.detail .why::before{content:"למה זה מתאים לנו";display:block;font:500 12.5px/1 var(--f-sans);color:var(--ink-3);margin-bottom:6px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-2);border-radius:999px;overflow:hidden;margin-top:18px}
.seg3 button{height:44px;font-size:14.5px;font-weight:500;border-inline-start:1px solid var(--line-2);transition:background .2s}
.seg3 button:first-child{border:0}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mine{width:100%;margin-top:16px;border:1px solid var(--line-2);border-radius:4px;background:var(--raise);padding:10px 12px;min-height:72px;resize:vertical;outline:0;font-size:15.5px}
.mine:focus{border-color:var(--ink)}
.dactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sched{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding:12px;background:var(--paper-2);border-radius:4px}
.sched label{font-size:13px;color:var(--ink-2)}
.sched select,.sched input{height:40px;border:1px solid var(--line-2);border-radius:4px;background:var(--paper);padding:0 8px}
.danger-link{color:var(--accent);font-size:14px;min-height:40px}

form.ed{display:grid;gap:14px}
form.ed h2{font:700 44px/.9 var(--f-display)}
form.ed .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.ed label{display:grid;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500}
form.ed input,form.ed select,form.ed textarea{border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:8px 0;min-height:42px;outline:0;border-radius:0;font-weight:400;color:var(--ink)}
form.ed input:focus,form.ed select:focus,form.ed textarea:focus{border-color:var(--ink)}
form.ed textarea{resize:vertical;font:400 16px/1.55 var(--f-serif)}
form.ed .kinds{display:flex;gap:6px;flex-wrap:wrap}
form.ed .hint{font-size:12px;color:var(--ink-3);font-weight:400}
form.ed fieldset{border:0;padding:0;margin:0;display:grid;gap:12px}
form.ed legend{font:700 22px/1 var(--f-display);padding:0;margin-bottom:6px}
.formacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;bottom:-24px;background:var(--paper);padding-block:12px;margin-bottom:-12px}

.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--line)}
.qgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px 4px;border-bottom:1px solid var(--line);text-align:start}
.qgrid button:nth-child(odd){border-inline-end:1px solid var(--line);padding-inline-end:14px}
.qgrid button:nth-child(even){padding-inline-start:14px}
.qgrid b{font:700 26px/1 var(--f-display)}
.qgrid small{font-size:13px;color:var(--ink-3)}
.qgrid svg{width:22px;height:22px;color:var(--ink-2)}

.toast{position:fixed;z-index:80;inset-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:440px;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 8px 8px 20px;padding-inline-start:20px;display:flex;align-items:center;gap:12px;font-size:14.5px;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;transition:all .35s var(--ease);pointer-events:none}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast span{flex:1}
.toast button{color:var(--paper);font-weight:600;padding:0 12px;min-height:36px;border-radius:999px;background:rgba(255,255,255,.12)}

/* ---------- concierge ---------- */
.cc{position:fixed;z-index:70;inset:0;background:var(--paper);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .5s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cc.on{transform:none}
.cc-h{display:flex;align-items:center;gap:10px;padding:10px max(8px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.cc-h .seal{width:28px;height:28px;color:var(--jungle)}
.cc-h h2{font:700 30px/1 var(--f-display)}
.cc-h .ctx{font-size:12.5px;color:var(--ink-3)}
.cc-h .sp{flex:1}
.cc-msgs{flex:1;overflow-y:auto;padding:18px var(--gut) 18px var(--gutR);display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.msg{max-width:62ch}
.msg.u{align-self:flex-start;background:var(--paper-2);padding:10px 15px;border-radius:18px 18px 18px 4px;font-size:15.5px;white-space:pre-wrap;max-width:85%}
.msg.a{align-self:stretch;font:400 17px/1.65 var(--f-serif);white-space:pre-wrap}
.msg.a .by{display:flex;align-items:center;gap:6px;font:500 12px/1 var(--f-sans);color:var(--ink-3);margin-bottom:8px}
.msg.a .by .seal{width:14px;height:14px;color:var(--jungle)}
.msg.a.think .txt{color:var(--ink-3)}
.msg.a.think .txt::after{content:"";display:inline-block;width:18px;animation:dots 1.4s steps(4) infinite;overflow:hidden;vertical-align:bottom;white-space:nowrap}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.ref{display:inline-flex;align-items:center;gap:5px;font:500 14.5px/1.3 var(--f-sans);background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 8px;cursor:pointer;vertical-align:1px;white-space:normal;text-align:start}
.ref::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--jungle);flex:none}
.ref:hover{border-color:var(--ink)}
.acts-r{display:flex;flex-direction:column;gap:6px;margin-top:10px;font:400 14px/1.4 var(--f-sans)}
.acts-r div{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2);padding:7px 12px;border-inline-start:2px solid var(--jungle);background:color-mix(in srgb,var(--jungle) 7%,transparent)}
.acts-r div.del{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.acts-r button{font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:32px}
.cc-sugs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px var(--gut) 4px var(--gutR)}
.cc-sugs::-webkit-scrollbar{display:none}
.cc-sugs button{flex:none;border:1px solid var(--line-2);border-radius:999px;padding:0 14px;height:38px;font-size:14px;white-space:nowrap}
.cc-sugs button:hover{background:var(--paper-2)}
.cc-in{display:flex;gap:8px;align-items:flex-end;padding:10px var(--gut) 12px var(--gutR)}
.cc-in textarea{flex:1;border:1px solid var(--line-2);border-radius:22px;padding:11px 16px;min-height:46px;max-height:140px;resize:none;background:var(--raise);outline:0;line-height:1.45}
.cc-in textarea:focus{border-color:var(--ink)}
.cc-in .iconbtn{flex:none;width:46px;height:46px}
.cc-in .send{background:var(--ink);color:var(--paper)}
.cc-in .send:disabled{opacity:.35}
.cc-in .mic.on{background:var(--accent);color:var(--accent-ink)}
.cc-hello{padding:10px 0 4px}
.cc-hello h3{font:700 54px/.85 var(--f-display)}
.cc-hello p{font:400 17px/1.6 var(--f-serif);color:var(--ink-2);margin-top:10px;max-width:46ch}
.cc-off{padding:20px 0;color:var(--ink-2)}

.seal{display:inline-block}
.statusline{font-size:13px;color:var(--ink-3);padding-block:6px}

@media (min-width:760px){
  .twocol{grid-template-columns:1.25fr 1fr;align-items:start}

  .chrow{grid-template-columns:1fr 30%}

  .chhero .plate{aspect-ratio:21/9;max-height:none}
  .hotel{grid-template-columns:1.3fr 1fr auto;align-items:end}

  .qgrid button:nth-child(even){padding-inline-start:4px}
  .qgrid button{border-inline-end:1px solid var(--line)!important;padding-inline:14px!important}

  .sheet{inset:0 auto 0 0;inset-inline-start:auto;inset-inline-end:0;width:min(520px,92vw);max-height:none;border-radius:0;transform:translateX(-102%)}

  .guide-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}

  .nav .navfoot{display:block}
  .nav .navbrand{display:block;height:auto;text-decoration:none;margin:-60px 12px 34px;padding:0;color:var(--ink)}
  .navbrand b{display:block;font:700 30px/.9 var(--f-display)}
  .navbrand span{font-size:12px;color:var(--ink-3)}
  .topbar .brand{visibility:hidden}
  .cc-li{border:0;height:auto;margin-top:18px}
  .nav-cc{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15.5px;height:50px;padding:0 6px;border-radius:4px}
  .nav-cc .orb{width:36px;height:36px;margin:0}
  .nav-cc .lb{font-size:15.5px}
  .nav-cc:hover{background:var(--paper-2)}
  .cover{margin-inline:0}
  .topbar .wrap{max-width:1180px}
  .mapwrap{height:calc(100vh - 56px - 24px);margin-inline:0;border-radius:3px}
  .chhero{margin-inline:0}
  .cards-h,.tray .row,.quick,.filters{margin-inline:0;padding-inline:0}

/* =========================================================
   8. DAY TIMELINE (used by Today + Plan)
   ========================================================= */
function dayTimeline(iso,{compact,reorder}={}){
  const S=stopOf(iso);const di=dayItems(iso);const out=[];const nT=nowBKK();const isToday=iso===today();
  const leaving=STOPS.find(s=>s.e===iso&&s!==S);const arriving=STOPS.find(s=>s.s===iso);
  if(leaving)out.push(`<li class="ev hotel"><div class="t"><small>בוקר</small></div><div class="body"><div class="n">צ'ק־אאוט · ${bdi(leaving.hotel.name)}</div></div><span></span></li>`);
  const timed=di.filter(i=>i.time),untimed=di.filter(i=>!i.time);
  let prevT=null;
  timed.forEach((i,ix)=>{if(prevT){const gap=(toMin(i.time)-toMin(prevT));if(gap>=180)out.push(`<li class="ev free"><span></span><div class="body">חלון פנוי · ${Math.floor(gap/60)} שעות ${askLink("מלא את החלון",`יש לנו חלון פנוי ביום ${fShort(iso)} בין ${prevT} ל־${i.time}. מה כדאי לשים בו מהמאגר?`)}</div><span></span></li>`)}
    out.push(evHtml(i,{isNow:isToday&&nextNowId(timed,nT.time)===i.id,reorder}));prevT=i.time});
  if(untimed.length){if(timed.length)out.push(`<li class="group">במהלך היום</li>`);untimed.forEach((i,ix)=>out.push(evHtml(i,{reorder,first:ix===0,last:ix===untimed.length-1})))}
  if(arriving&&iso!==TRIP.s||iso===TRIP.s)out.push(`<li class="ev hotel"><div class="t"><small>הגעה</small></div><div class="body"><div class="n">צ'ק־אין · ${bdi(arriving.hotel.name)}</div></div><span></span></li>`);
  if(iso===TRIP.e)out.push(`<li class="ev hotel"><div class="t"><small>סיום</small></div><div class="body"><div class="n">היום האחרון של הטיול</div></div><span></span></li>`);
  const real=di.length;
  if(!real){const eh=`<div class="empty"><h3>${isToday?"היום עוד ריק":"יום פתוח"}</h3><p>${S?`עוד לא שיבצתם כלום ל${fDay(iso)}. אפשר לבחור מהמאגר של ${S.n} או לבקש מהקונסיירז' להרכיב יום.`:""}</p>
     <div class="acts">${S?`<button class="btn sm" type="button" data-act="ask" data-q="${esc(`תכנן לנו את ${fDay(iso)} ב${S.n}: בוקר, צהריים, ערב ולילה, מהמאגר שלנו. שבץ את הפריטים ליום הזה עם שעות.`)}">${ico("i-seal","seal")}תכנן לי את היום</button>`:""}<button class="btn ghost sm" type="button" data-act="new" data-date="${iso}">${ico("i-plus")}הוספה ידנית</button></div></div>`;
    return (out.length?`<ol class="tl">${out.join("")}</ol>`:"")+eh}
  return `<ol class="tl">${out.join("")}</ol>`}
const toMin=t=>{const[h,m]=String(t).split(":").map(Number);return h*60+(m||0)};
const nextNowId=(timed,now)=>{const n=timed.find(i=>i.status!=="done"&&i.time>=now);return n&&n.id};
function evHtml(i,{isNow,reorder,first,last}={}){
  const k=kindOf(i);const cls=["ev",k==="activity"&&isMajor(i)?"major":k,i.status==="done"?"done":"",isNow?"now":""].join(" ");
  const time=i.time?`${esc(i.time)}`:"";
  const sub=k==="transport"?"דרך":k==="booking"?"הזמנה":k==="meal"?"ארוחה":CATN[i.cat]||"";
  const side=reorder&&!i.time?`<div class="reorder"><button type="button" data-act="mv" data-dir="-1" data-id="${esc(i.id)}" aria-label="הזזה למעלה" ${first?"disabled":""}>${ico("i-up")}</button><button type="button" data-act="mv" data-dir="1" data-id="${esc(i.id)}" aria-label="הזזה למטה" ${last?"disabled":""}>${ico("i-down")}</button></div>`:`<div class="side">${doneBox(i)}</div>`;
  return `<li class="${cls}"><div class="t">${time}</div>
   <div class="body" data-act="open" data-id="${esc(i.id)}" role="button" tabindex="0"><div class="k">${["booking","transport"].includes(k)?`<span class="kl">${esc(sub)}</span>`:""}${tagHtml(i)}${i.fav?'<span style="color:var(--accent)">♥</span>':""}</div>
   <div class="n">${bdi(i.name)}</div>${metaLine(i)?`<div class="m">${metaLine(i)}</div>`:""}${i.mine?`<div class="m" style="font-family:var(--f-serif);font-style:italic">"${bdi(i.mine)}"</div>`:""}</div>${side}</li>`}

let GEO=null,geoP=null;
const COS=Math.cos(10*Math.PI/180);
const px=lng=>lng*COS,py=lat=>-lat;
function loadGeo(){if(!geoP)geoP=fetch("geo.json").then(r=>r.json()).then(g=>{GEO={};for(const[k,L]of Object.entries(g.layers)){GEO[k]=L.rings.map(fl=>{let x=0,y=0,d="";for(let i=0;i<fl.length;i+=2){x+=fl[i];y+=fl[i+1];d+=(i?"L":"M")+(px(x/1e4)).toFixed(4)+" "+(py(y/1e4)).toFixed(4)}return d+"Z"}).join("")}return GEO}).catch(()=>null);return geoP}
loadGeo().then(()=>{if(route==="map")initMap();document.querySelectorAll("[data-minimap]").forEach(drawMini)});
const REG=k=>k==="all"?[97.9,7.3,101.4,14.1]:stopByK(k).box;
const landPaths=()=>GEO?["overview","phuket","islands","pattaya","bangkok"].map(k=>`<path class="land" d="${GEO[k]}"/>`).join(""):"";
function miniMap(k){return `<svg data-minimap="${k}" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>`}
function drawMini(svg){if(!GEO)return;const k=svg.dataset.minimap;const b=REG(k);const w=px(b[2])-px(b[0]),h=py(b[1])-py(b[3]);const pad=w*.06;
  svg.setAttribute("viewBox",`${px(b[0])-pad} ${py(b[3])-pad} ${w+pad*2} ${h+pad*2}`);const r=w/80;
  const pts=items.filter(i=>i.lat&&(k==="all"||i.dest===k));const S=stopByK(k);
  svg.innerHTML=`<rect x="-1000" y="-1000" width="3000" height="3000" fill="color-mix(in srgb,var(--sea) 20%,var(--paper))"/>${landPaths()}${pts.map(i=>`<circle cx="${px(i.lng)}" cy="${py(i.lat)}" r="${r}" fill="${pinColor(i)}" stroke="var(--paper)" stroke-width="${r*.35}"/>`).join("")}${S?`<rect x="${px(S.hotel.lng)-r*1.1}" y="${py(S.hotel.lat)-r*1.1}" width="${r*2.2}" height="${r*2.2}" fill="var(--ink)" stroke="var(--paper)" stroke-width="${r*.35}"/>`:""}`}
const pinColor=i=>i.status==="done"?"var(--ok)":i.fav?"var(--accent)":({night:"var(--ink)",event:"var(--accent)",food:"var(--warn)",sea:"var(--sea)",extreme:"var(--olive)",shop:"var(--ink-3)"}[i.cat]||"var(--jungle)");
const MFILTERS=[["all","הכול"],["planned","בתוכנית"],["want","רוצים"],["fav","מועדפים"],["done","עשינו"],["night","חיי לילה"],["food","אוכל"],["sea","חופים"],["extreme","טבע"],["event","אירועים"],["shop","שופינג"]];
function mapItems(){const f=mapState.filter,r=mapState.region;return items.filter(i=>i.lat&&i.lng&&(r==="all"||i.dest===r)&&(f==="all"||(f==="planned"?!!i.date:f==="want"?i.status==="want":f==="fav"?i.fav:f==="done"?i.status==="done":i.cat===f)))}
function vMap(){const its=mapItems();const r=mapState.region;const noLoc=items.filter(i=>(r==="all"||i.dest===r)&&!i.lat&&!["warn","move","book"].includes(i.cat)).length;
  return `<div class="mapview"><div class="mapwrap" id="mapwrap"><svg id="mapsvg" role="img" aria-label="מפת הטיול"></svg>
   <div class="maptop"><div class="regions" role="group" aria-label="אזור"><button class="chip" type="button" data-act="mreg" data-r="all" aria-pressed="${r==="all"}">כל הטיול</button>${STOPS.map(s=>`<button class="chip" type="button" data-act="mreg" data-r="${s.k}" aria-pressed="${r===s.k}">${s.n}</button>`).join("")}</div>
   <div class="mfil" role="group" aria-label="סינון">${MFILTERS.map(([k,n])=>`<button class="chip" type="button" data-act="mfil" data-f="${k}" aria-pressed="${mapState.filter===k}">${n}</button>`).join("")}</div></div>
   <div class="mapzoom"><button type="button" data-act="mzoom" data-z="0.6" aria-label="התקרבות">${ico("i-plus")}</button><button type="button" data-act="mzoom" data-z="1.6" aria-label="התרחקות">${ico("i-minus")}</button></div>
   ${r!=="all"?`<div class="mapask">${`<button class="btn sm" type="button" data-act="ask" data-q="${esc(`מה מעניין סביב הנקודות שלנו ב${stopByK(r).n}? תציע מקומות שקרובים זה לזה כדי לחבר ליום אחד.`)}">${ico("i-seal","seal")}מה מעניין כאן?</button>`}</div>`:""}
   <div class="mapnote">${its.length} על המפה${noLoc?` · ${noLoc} בלי מיקום`:""}</div><div class="attrib">© OpenStreetMap contributors</div></div></div>`}
let MV=null;
function initMap(){const svg=$("#mapsvg");if(!svg)return;if(!GEO){svg.innerHTML=`<text x="0" y="0">טוען…</text>`;return}
  const wrap=$("#mapwrap");MV=MV&&MV.region===mapState.region?MV:{region:mapState.region};
  svg.innerHTML=`<rect x="-1000" y="-1000" width="3000" height="3000" fill="transparent"/><g id="grat"></g>${landPaths()}<g id="routeG"></g><g id="pinsG"></g>`;
  if(!MV.vb)fitMap(true);else applyVB();bindMap(svg,wrap)}
function fitMap(reset){const svg=$("#mapsvg");if(!svg)return;const wrap=$("#mapwrap");const cw=wrap.clientWidth,ch=wrap.clientHeight;
  if(reset||!MV.vb){const b=REG(mapState.region);let x0=px(b[0]),x1=px(b[2]),y0=py(b[3]),y1=py(b[1]);const w=x1-x0,h=y1-y0;const top=110/ch*h;let vw=w,vh=h+top;if(vw/vh>cw/ch)vh=vw*ch/cw;else vw=vh*cw/ch;
   MV.vb={x:(x0+x1)/2-vw/2,y:(y0+y1)/2-vh/2-top/2,w:vw,h:vh}}else{MV.vb.h=MV.vb.w*ch/cw}applyVB()}
function applyVB(){const svg=$("#mapsvg");if(!svg||!MV.vb)return;const{x,y,w,h}=MV.vb;svg.setAttribute("viewBox",`${x} ${y} ${w} ${h}`);drawPins()}
function drawPins(){const svg=$("#mapsvg");if(!svg)return;const cw=svg.clientWidth||1;const u=MV.vb.w/cw;const its=mapItems();
  const r=Math.max(5.5,Math.min(9,6+its.length/40))*u;
  const hotels=STOPS.filter(s=>mapState.region==="all"||s.k===mapState.region);
  $("#routeG").innerHTML=(mapState.region==="all"?`<polyline class="route-line" points="${STOPS.map(s=>px(s.hotel.lng)+","+py(s.hotel.lat)).join(" ")}"/>`:"")+
   hotels.map(s=>`<g class="pin" data-act="hotel" data-k="${s.k}"><rect x="${px(s.hotel.lng)-7*u}" y="${py(s.hotel.lat)-7*u}" width="${14*u}" height="${14*u}" fill="var(--ink)" stroke="var(--paper)" stroke-width="${2*u}"/><text x="${px(s.hotel.lng)}" y="${py(s.hotel.lat)+3.6*u}" text-anchor="middle" style="font-size:${10*u}px;fill:var(--paper);stroke:none;font-family:var(--f-display);font-weight:700">${s.ch.replace("׳","")}</text><text x="${px(s.hotel.lng)-12*u}" y="${py(s.hotel.lat)+(mapState.region==="all"?({phangan:-8,samui:14}[s.k]||4):4)*u}" text-anchor="start" style="font-size:${13*u}px;stroke-width:${3.5*u}px;font-weight:600" direction="rtl">${mapState.region==="all"?s.n:esc(s.hotel.name)}</text></g>`).join("");
  $("#pinsG").innerHTML=its.map(i=>{const sel=mapState.sel===i.id;return `<g class="pin ${sel?"sel":""}" data-act="mpin" data-id="${esc(i.id)}" tabindex="0" role="button" aria-label="${esc(i.name)}">${sel?`<circle class="o" cx="${px(i.lng)}" cy="${py(i.lat)}" r="${r*1.9}"/>`:""}<circle cx="${px(i.lng)}" cy="${py(i.lat)}" r="${r}" fill="${pinColor(i)}"/>${mapState.region!=="all"&&(sel||MV.vb.w<0.12)?`<text x="${px(i.lng)-r*1.4}" y="${py(i.lat)+4*u}" text-anchor="start" direction="rtl" style="font-size:${12*u}px;stroke-width:${3.5*u}px">${esc(i.name)}</text>`:""}</g>`}).join("");
  const g=$("#grat");if(g){const step=MV.vb.w>2?1:MV.vb.w>.4?.2:.05;let s="";
   for(let lng=92;lng<=108;lng+=step)s+=`<line class="grat" x1="${px(lng)}" x2="${px(lng)}" y1="${py(19.5)}" y2="${py(2.5)}"/>`;for(let lat=3;lat<=19;lat+=step)s+=`<line class="grat" y1="${py(lat)}" y2="${py(lat)}" x1="${px(92)}" x2="${px(108.5)}"/>`;g.innerHTML=s}}
function bindMap(svg,wrap){if(svg.dataset.bound)return;svg.dataset.bound=1;const pts=new Map();let start=null,moved=0;
  const toUser=(cx,cy)=>{const r=svg.getBoundingClientRect();return{x:MV.vb.x+(cx-r.left)/r.width*MV.vb.w,y:MV.vb.y+(cy-r.top)/r.height*MV.vb.h}};
  const zoomAt=(f,cx,cy)=>{const p=toUser(cx,cy);const nw=Math.min(9,Math.max(.01,MV.vb.w*f));const k=nw/MV.vb.w;MV.vb={x:p.x-(p.x-MV.vb.x)*k,y:p.y-(p.y-MV.vb.y)*k,w:nw,h:MV.vb.h*k};applyVB()};
  F.zoomAt=zoomAt;
  svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;start={vb:{...MV.vb},pts:new Map([...pts].map(([k,v])=>[k,{...v}]))}});
  svg.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=svg.getBoundingClientRect();
    if(pts.size===1&&start){const p=[...pts.values()][0],s0=[...start.pts.values()][0];if(!s0)return;const dx=p.x-s0.x,dy=p.y-s0.y;moved=Math.max(moved,Math.hypot(dx,dy));MV.vb={...start.vb,x:start.vb.x-dx/r.width*start.vb.w,y:start.vb.y-dy/r.height*start.vb.h};applyVB()}
    else if(pts.size===2&&start&&start.pts.size===2){const[a,b]=[...pts.values()],[a0,b0]=[...start.pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),d0=Math.hypot(a0.x-b0.x,a0.y-b0.y);moved=99;const k=d0/d;const cx=(a0.x+b0.x)/2,cy=(a0.y+b0.y)/2;
      const ux=start.vb.x+(cx-r.left)/r.width*start.vb.w,uy=start.vb.y+(cy-r.top)/r.height*start.vb.h;const nw=Math.min(9,Math.max(.01,start.vb.w*k));const kk=nw/start.vb.w;MV.vb={x:ux-(ux-start.vb.x)*kk,y:uy-(uy-start.vb.y)*kk,w:nw,h:start.vb.h*kk};applyVB()}});
  const end=e=>{pts.delete(e.pointerId);start=pts.size?{vb:{...MV.vb},pts:new Map([...pts].map(([k,v])=>[k,{...v}]))}:null;
    if(!pts.size&&moved<6&&e.type==="pointerup"){const tgt=document.elementFromPoint(e.clientX,e.clientY);const g=tgt&&tgt.closest("[data-act]");if(g&&svg.contains(g))handleAct(g,e)}};
  svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
  svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(Math.exp(e.deltaY*.0015),e.clientX,e.clientY)},{passive:false})}

function jEntry(i){const S=stopByK(i.dest);const ph=photos.filter(p=>p.item===i.id);
  return `<article class="jent"><div class="eyebrow">${S?S.n:"כל הטיול"} · ${CATN[i.cat]||""}${i.time?` · <span class="mono">${esc(i.time)}</span>`:""}</div>

function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);let d=c.toDataURL("image/jpeg",q);if(d.length>240000)d=c.toDataURL("image/jpeg",.55);res(d)};img.onerror=rej;img.src=u})}

let ccOn=false,busy=false;
const AGENT=`אתה הסוכן האישי (הקונסיירז') של אביב ואופק, שני חברים בני 28 בטיול בתאילנד (25.11–20.12.2026). סגנון: חיי לילה, טכנו ו-EDM, ביץ' קלאבים, איים, אקסטרים, אוכל רחוב ומסעדות טובות, Hidden Gems. לא טיול משפחתי.
מלונות: פוקט 25.11–1.12 Hotel Clover Patong; קופנגן 1–6.12 Phangan Bayshore Resort (האד רין נוק); קוסמוי 6–12.12 Arkbar Beach Club & Resort (צ'אוונג); פטאיה 12–18.12 Hotel Amber Pattaya (ליד Soi Buakhao); בנגקוק 18–20.12 Novotel Platinum Pratunam.
כללים: ענה תמיד בעברית, ישיר וקצר כמו חבר שמכיר את תאילנד. שמות מקומות כתוב באותיות לטיניות כמו שהם (Catch Beach Club), לא בתעתיק. מחירים בבאט עם ฿. התחשב במיקום המלון ובשעה. אל תמציא מקומות, מחירים, שעות או אירועים; אין לך גישה לאינטרנט כאן – אם צריך מידע עדכני (מסיבה הערב, תחזית) אמור זאת והצע לבדוק בשיחה הראשית עם Claude. סווג MUST/HIGH/OPTIONAL/HIDDEN GEM/BACKUP ותן התאמה 1–10 כשממליץ. כשמבקשים להוסיף, לסמן, לשבץ ליום, להזיז או לעדכן פריט – השתמש בכלים. כשמדווחים על הוצאה – סכם בקצרה; מעקב תקציב מלא נעשה בשיחה הראשית עם Claude.
כשאתה מזכיר פריט שקיים במאגר, כתוב את המזהה שלו בסוגריים כפולים, למשל [[p04]], והאפליקציה תציג אותו ככרטיס לחיץ. אל תכתוב את המזהה בשום צורה אחרת.
שיבוץ למסלול: לפריט יש date (YYYY-MM-DD, רק בין 2026-11-25 ל-2026-12-20) ו-time (HH:MM). לשבץ = update_item עם date ו-time. "זמן חופשי" = kind "free". מחיקה דורשת אישור של המשתמש באפליקציה – השתמש ב-delete_item ותגיד שצריך לאשר.`;
const ccTools=[
 {name:"add_item",description:"מוסיף פריט חדש למאגר (ואם יש date – גם למסלול). מחזיר את ה-id החדש.",inputSchema:{type:"object",properties:{name:{type:"string"},dest:{type:"string",enum:["phuket","phangan","samui","pattaya","bangkok","all"]},cat:{type:"string",enum:CATS.map(c=>c[0])},kind:{type:"string",enum:KINDS.map(k=>k[0])},tag:{type:"string",enum:Object.keys(TAGS)},score:{type:"number"},when:{type:"string"},cost:{type:"string"},dist:{type:"string"},note:{type:"string"},link:{type:"string"},date:{type:"string",description:"YYYY-MM-DD"},time:{type:"string",description:"HH:MM"}},required:["name","dest","cat"]},
  execute:async a=>{if(!db||!canWrite)throw new Error("אין הרשאת כתיבה");const v={};for(const k of["name","dest","cat","kind","tag","when","cost","dist","note","link","date","time"])if(a[k]!=null)v[k]=String(a[k]);if(a.score!=null)v.score=Number(a.score);
   if(v.date&&!DAYS.includes(v.date))throw new Error("date מחוץ לטיול");if(v.link&&!safeUrl(v.link))delete v.link;const id=await createItem(v);curActs.push({t:"add",id,name:v.name});return{ok:true,id}}},
 {name:"update_item",description:"מעדכן פריט קיים לפי id. fields יכול לכלול: status (want/done/skip/''), mine, note, tag, score, when, cost, dist, link, name, date, time, fav (true/false), kind, rating (1-5), memory.",inputSchema:{type:"object",properties:{id:{type:"string"},fields:{type:"object"}},required:["id","fields"]},
  execute:async a=>{const it=byId(String(a.id));if(!db||!it)throw new Error("unknown id");const ok=["status","mine","note","tag","score","when","cost","dist","link","name","date","time","fav","kind","rating","memory"];const p={},prev={};
   for(const k of ok)if(a.fields&&k in a.fields){p[k]=a.fields[k];prev[k]=it[k]??""}
   if(p.date&&!DAYS.includes(p.date))throw new Error("date מחוץ לטיול");if(p.status==="done")p.doneAt=new Date().toISOString();
   if(!Object.keys(p).length)throw new Error("אין שדות לעדכון");await save(it.id,p);curActs.push({t:"upd",id:it.id,name:it.name,prev,next:p});return{ok:true}}},
 {name:"delete_item",description:"מבקש למחוק פריט. המחיקה מתבצעת רק אחרי שהמשתמש מאשר בכפתור באפליקציה.",inputSchema:{type:"object",properties:{id:{type:"string"},reason:{type:"string"}},required:["id"]},
  execute:async a=>{const it=byId(String(a.id));if(!it)throw new Error("unknown id");curActs.push({t:"del",id:it.id,name:it.name,state:"pending"});return{ok:true,awaiting_user_confirmation:true}}}];
let curActs=[];
function ccContext(){const t=today();const S=stopOf(t);const v=stopByK(route)?`עמוד היעד ${stopByK(route).n}`:{today:"מסך היום",plan:`המסלול, יום ${dayNo(planDay||t)} (${planDay||t})`,chapters:"רשימת היעדים",map:`המפה (${mapState.region==="all"?"כל הטיול":stopByK(mapState.region).n})`,journal:"היומן"}[route];
  return{t,S,v}}
function ccCtxLine(){const{t,S,v}=ccContext();return `${S?`יום ${dayNo(t)} · ${S.n}`:t<TRIP.s?`עוד ${diffDays(t,TRIP.s)} ימים להמראה`:"אחרי הטיול"} · ${v}`}
function openCC(){const cc=$("#cc");cc.hidden=false;requestAnimationFrame(()=>cc.classList.add("on"));ccOn=true;$("#ccCtx").textContent=ccCtxLine();renderSugs();renderChat();document.body.style.overflow=window.innerWidth<760?"hidden":"";setTimeout(()=>{if(window.innerWidth>=760)$("#ccIn").focus()},400)}
function closeCC(){const cc=$("#cc");cc.classList.remove("on");ccOn=false;document.body.style.overflow="";setTimeout(()=>{if(!ccOn)cc.hidden=true},500);$("#askBtn").focus()}
function renderSugs(){const{t,S}=ccContext();const r=route;let s=[];
  if(r==="plan"){const d=planDay||t;s=[`תכנן לי את ${fShort(d)}`,`סדר את ${fShort(d)} במסלול הגיוני`,"מה עוד לא שיבצנו?"]}
  else if(stopByK(r)){const C=stopByK(r);s=[`מה ה־MUST ב${C.n}?`,`מסעדה טובה ליד ${C.hotel.name}`,`חוף מומלץ ב${C.n}`]}
  else if(r==="map")s=["מה מעניין סביב הנקודות האלה?","מה המסלול הכי טוב ביניהן?"];
  else if(r==="journal")s=["מה כבר עשינו?","מה פספסנו עד עכשיו?"];
  else s=t<TRIP.s?["מה חייבים לסגור לפני הטיסה?","מה לא לפספס בפוקט?","תכנן לנו את היום הראשון"]:["מה עושים עכשיו?","איפה אוכלים הערב?","תכנן לי את מחר","יורד גשם, מה עושים?","מה עוד לא עשינו?"];
  $("#ccSugs").innerHTML=s.map(x=>`<button type="button" data-sug="${esc(x)}">${esc(x)}</button>`).join("")}
$("#ccSugs").addEventListener("click",e=>{const b=e.target.closest("[data-sug]");if(b)sendCC(b.dataset.sug)});
function richText(t){return esc(t).replace(/\[\[([A-Za-z0-9_-]{1,40})\]\]/g,(m,id)=>{const it=byId(id);return it?`<button class="ref" type="button" data-act="ref" data-id="${esc(id)}"><bdi>${esc(it.name)}</bdi></button>`:""})}
function actsHtml(m,mi){if(!m.acts||!m.acts.length)return "";return `<div class="acts-r">${m.acts.map((a,ai)=>{const key=mi+":"+ai;const it=byId(a.id);
  if(a.t==="add")return `<div>נוסף: ${it?`<button class="ref" type="button" data-act="ref" data-id="${esc(a.id)}"><bdi>${esc(a.name)}</bdi></button>`:bdi(a.name)}${a.undone?" · בוטל":it?` <button type="button" data-act="undo" data-ai="${key}">ביטול</button>`:""}</div>`;
  if(a.t==="upd")return `<div>עודכן: ${it?`<button class="ref" type="button" data-act="ref" data-id="${esc(a.id)}"><bdi>${esc(a.name)}</bdi></button>`:bdi(a.name)} <span class="it-m">${esc(describePatch(a.next))}</span>${a.undone?" · בוטל":it&&a.prev?` <button type="button" data-act="undo" data-ai="${key}">ביטול</button>`:""}</div>`;
  if(a.t==="del")return `<div class="del">מחיקה של ${bdi(a.name)}: ${a.state==="pending"&&it?`<button type="button" data-act="cdel" data-ai="${key}" data-ok="1">אישור מחיקה</button> <button type="button" data-act="cdel" data-ai="${key}" data-ok="0">השארה</button>`:a.state==="done"?"נמחק":"נשאר במאגר"}</div>`;return ""}).join("")}</div>`}
function describePatch(p){if(!p)return "";const o=[];if(p.date!==undefined)o.push(p.date?`יום ${dayNo(p.date)}`:"הוסר מהמסלול");if(p.time)o.push(p.time);if(p.status!==undefined)o.push(p.status?ST[p.status]:"ללא סטטוס");if(p.fav!==undefined)o.push(p.fav?"מועדף":"לא מועדף");if(p.rating)o.push(p.rating+"★");if(p.mine!==undefined||p.note!==undefined)o.push("הערה");return o.join(" · ")}
function renderChat(){const box=$("#ccMsgs");if(!box)return;
  if(!sample){box.innerHTML=`<div class="cc-hello"><h3>הקונסיירז'</h3><p class="cc-off">${sampleState==="loading"?"מתחבר…":"הקונסיירז' זמין כשהדף פתוח ב־claude.ai עם חשבון מחובר."}</p></div>`;return}
  const hello=`<div class="cc-hello"><h3>מה בא לכם?</h3><p>אני מכיר את המסלול, המלונות והמאגר שלכם. אני יכול לתכנן יום, לשבץ, להזיז, לסמן ולהוסיף. בלי אינטרנט – אז על מסיבות של הלילה ותחזיות, נבדוק בשיחה הראשית.</p></div>`;
  box.innerHTML=(chat.length?"":hello)+chat.map((m,mi)=>m.r==="u"?`<div class="msg u" dir="auto">${esc(m.t)}</div>`:`<div class="msg a ${m.think?"think":""}"><div class="by">${ico("i-seal","seal")}הקונסיירז'</div><div class="txt" dir="rtl">${richText(m.t)}</div>${actsHtml(m,mi)}</div>`).join("");
  box.scrollTop=box.scrollHeight}
async function persistChat(){if(!db||!canWrite)return;try{await db.doc("chat/log").set({messages:chat.slice(-60).map(({think,...m})=>m),updatedAt:new Date().toISOString()})}catch(e){}}
async function undoAct(key){const[mi,ai]=key.split(":").map(Number);const m=chat[mi];const a=m&&m.acts&&m.acts[ai];if(!a||a.undone)return;
  if(a.t==="add"){const it=byId(a.id);if(it){await db.doc("items/"+a.id).delete();}}else if(a.t==="upd"&&a.prev){await save(a.id,a.prev)}
  a.undone=true;renderChat();persistChat();render();toast("בוטל")}
async function confirmAgentDelete(key,ok){const[mi,ai]=key.split(":").map(Number);const a=chat[mi]&&chat[mi].acts[ai];if(!a||a.state!=="pending")return;
  if(ok){const it=byId(a.id);if(it)await removeItem(it);a.state="done"}else a.state="kept";renderChat();persistChat();render()}
$("#ccForm").addEventListener("submit",e=>{e.preventDefault();const t=$("#ccIn").value.trim();if(t)sendCC(t)});
$("#ccIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>=760){e.preventDefault();$("#ccForm").requestSubmit()}});
async function sendCC(t){if(!sample){toast("הקונסיירז' לא זמין כאן");return}if(busy){toast("רגע, עוד עונה על הקודמת");return}busy=true;$("#ccIn").value="";$("#ccIn").style.height="";$("#ccSend").disabled=true;
  chat=[...chat,{r:"u",t,at:new Date().toISOString()}];renderChat();persistChat();
  const{t:td,S,v}=ccContext();const nb=nowBKK();
  const lite=items.map(i=>{const o={id:i.id,dest:i.dest,cat:i.cat,name:i.name,tag:i.tag,score:i.score,when:i.when,status:i.status};if(i.kind)o.kind=i.kind;if(i.date)o.date=i.date;if(i.time)o.time=i.time;if(i.fav)o.fav=true;if(i.mine)o.mine=i.mine;if(i.cost)o.cost=i.cost;if(i.dist)o.dist=i.dist;if(i.rating)o.rating=i.rating;if(i.memory)o.memory=i.memory;if(i.note&&(i.dest===(S||{}).k||i.dest==="all"))o.note=i.note;return o});
  const days=DAYS.map(d=>`${d}=יום ${dayNo(d)} ${stopOf(d).k}`).join(", ");
  const hist=chat.slice(-12,-1).map(m=>(m.r==="u"?"משתמש: ":"סוכן: ")+m.t).join("\n");
  const notes=Object.entries(notesDocs).filter(([,n])=>n.text).map(([k,n])=>`${k}: ${n.text}`).join("\n");
  const input=`${AGENT}\n\nזמן מקומי בתאילנד: ${simDate?td+" (תצוגה מדומה)":nb.date} ${nb.time}. ${S?`היום הוא יום ${dayNo(td)} מתוך 26, ב${S.n}.`:td<TRIP.s?`הטיול מתחיל בעוד ${diffDays(td,TRIP.s)} ימים.`:"הטיול הסתיים."}\nהמשתמש נמצא ב: ${v}.\nימי הטיול: ${days}\n${notes?`הפנקסים לפי יעד:\n${notes}\n`:""}המאגר (JSON):\n${JSON.stringify(lite)}\n\nהשיחה עד עכשיו:\n${hist||"(אין)"}\n\nההודעה החדשה: ${t}`;
  const live={r:"a",t:"חושב",think:true,acts:[]};chat=[...chat,live];curActs=live.acts;renderChat();
  try{const res=await sample(input,{cache:false,tools:ccTools,onText:({text})=>{live.think=false;live.t=text;renderChat()}});live.t=res.text||live.t;live.think=false}
  catch(err){live.think=false;live.t=err&&err.text?err.text:err&&err.code==="rate_limited"?"יותר מדי בקשות. נסו שוב בעוד דקה.":err&&err.code==="not_granted"?"הקונסיירז' לא אושר בדף הזה. אפשר לאשר בתפריט ההרשאות של הדף.":"משהו נכשל. נסו שוב."}
  live.at=new Date().toISOString();chat=[...chat];renderChat();await persistChat();busy=false;render()}
/* dictation */
let dictOn=false;
$("#micBtn").addEventListener("click",()=>{if(!dict)return;if(dictOn){dict.stop().catch(()=>{});return}
  const base=$("#ccIn").value;let acc=base?base+" ":"";dict.onPartial(({text})=>{$("#ccIn").value=acc+text});dict.onFinal(({text})=>{acc+=text+" ";$("#ccIn").value=acc;$("#ccSend").disabled=!acc.trim()});
  dict.onState(({state})=>{dictOn=state!=="idle";$("#micBtn").classList.toggle("on",dictOn);$("#micBtn").setAttribute("aria-pressed",dictOn)});
  dict.start({language:"he"}).catch(err=>{if(err&&(err.code==="not_granted"||err.code==="unavailable"))$("#micBtn").hidden=true})});

/* =========================================================
   16. BOOT
   ========================================================= */
let sampleState="loading";
route=readHash();render(true);
(async()=>{
  if(!window.claude||!claude.use){status("פתחו ב־claude.ai כדי לסנכרן","err");sampleState="off";return}
  const timer=setTimeout(()=>{if(!synced)status("עדיין מתחבר…","")},10000);
  db=await claude.use("db");
  if(!db){clearTimeout(timer);status("אין חיבור למאגר","err");}
  else{
    userNs=await claude.use("user");
    if(userNs&&userNs.can){try{const w=await userNs.can("data.write");if(w===false)canWrite=false}catch(e){}}
    db.collection("items").onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache){clearTimeout(timer);synced=true;status(canWrite?"מסונכרן":"צפייה בלבד","live")}
      const ae=document.activeElement;const typing=ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")&&$("#main").contains(ae)&&ae.id!=="chq";if(!typing)render();if(sheetOn&&$("#sheetBody .detail h2")&&F.openId){} if(ccOn)renderChat();
      document.querySelectorAll("[data-minimap]").forEach(drawMini)},e=>{clearTimeout(timer);status("החיבור נפל – רעננו","err")});
    db.collection("photos").onSnapshot(s=>{photos=s.docs.map(d=>({id:d.id,...d.data()}));if(route==="journal")render()},()=>{});
    db.collection("notes").onSnapshot(s=>{notesDocs=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));const ta=$("#chnote");if(ta&&document.activeElement!==ta){const k=ta.dataset.k;ta.value=(notesDocs[k]||{}).text||""}},()=>{});
    db.doc("chat/log").onSnapshot(s=>{if(busy)return;chat=(s.exists&&s.data().messages)||[];if(ccOn)renderChat()},()=>{});
  }
  sample=await claude.use("sample");sampleState=sample?"on":"off";if(ccOn)renderChat();
  dict=await claude.use("dictation");if(dict)$("#micBtn").hidden=false;
  downloads=await claude.use("downloads");
})();
}
